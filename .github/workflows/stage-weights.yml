name: stage-weights
on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/stage-weights.yml"]
jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SmolLM2-135M-Instruct from HuggingFace
        run: |
          set -e
          mkdir -p stage
          BASE=https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct/resolve/main
          for f in model.safetensors config.json tokenizer.json tokenizer_config.json generation_config.json; do
            echo "downloading $f"
            curl -sL --retry 3 --max-time 300 -o stage/$f "$BASE/$f"
          done
          ls -la stage
      - name: Repack into chunked raw fp16 + manifest
        run: |
          set -e
          pip install --quiet numpy safetensors
          python3 - <<'PY'
          import json, os, struct, numpy as np
          from safetensors import safe_open
          os.makedirs("stage/chunks", exist_ok=True)
          with open("stage/model.safetensors","rb") as f:
              n = struct.unpack("<Q", f.read(8))[0]
              hdr = json.loads(f.read(n))
          names = sorted(k for k in hdr if k != "__metadata__")
          CHUNK = 45*1024*1024
          tensors, cur, curbuf, cidx = [], [], bytearray(), 0
          def flush():
              global curbuf, cidx
              if not curbuf: return
              p = f"stage/chunks/w_{cidx:03d}.bin"
              open(p,"wb").write(bytes(curbuf))
              curbuf = bytearray(); cidx += 1
          with safe_open("stage/model.safetensors", framework="numpy") as f:
              for name in names:
                  a = f.get_tensor(name)
                  raw = a.tobytes()
                  off = len(curbuf)
                  if off + len(raw) > CHUNK:
                      flush(); off = 0
                  curbuf += raw
                  tensors.append({"name": name, "dtype": str(a.dtype), "shape": list(a.shape),
                                  "chunk": cidx, "offset": off, "nbytes": len(raw)})
          flush()
          cfg = json.load(open("stage/config.json"))
          manifest = {"arch": "smollm2", "source": "HuggingFaceTB/SmolLM2-135M-Instruct",
                      "config": cfg, "tensors": tensors, "chunk_size": CHUNK}
          json.dump(manifest, open("stage/manifest.json","w"), indent=1)
          nparams = sum(int(np.prod(t["shape"])) for t in tensors)
          print("tensors:", len(tensors), "params:", nparams)
          print(json.dumps(cfg, indent=1))
          PY
          du -sh stage/chunks/* | tail -3
      - name: Commit staged weights to temp branch
        run: |
          set -e
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          cp stage/config.json stage/tokenizer.json stage/tokenizer_config.json stage/generation_config.json stage/manifest.json /tmp/ 2>/dev/null || true
          mkdir -p stage-out
          cp -r stage/chunks stage/manifest.json stage/config.json stage/tokenizer.json stage/tokenizer_config.json stage/generation_config.json stage-out/
          git checkout --orphan weights-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .github css javascript js models scripts vendor index.html bundle.json dataset.json package.json server.mjs README.md LICENSE 2>/dev/null || true
          git add -A stage-out
          git commit -q -m "staged SmolLM2-135M-Instruct fp16 (${GITHUB_SHA::8})"
          git push -f origin weights-tmp
