name: stage-weights
on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/stage-weights.yml"]
jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Diag + fetch
        continue-on-error: true
        run: |
          mkdir -p stage-out
          exec > >(tee -a stage-out/log.txt) 2>&1
          set -x
          python3 -VV
          echo "--- HF reachability ---"
          curl -sIL --max-time 30 https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct/resolve/main/config.json | head -25
          BASE=https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct/resolve/main
          mkdir -p stage
          for f in config.json tokenizer.json tokenizer_config.json generation_config.json model.safetensors; do
            echo "downloading $f"
            curl -sL --retry 3 --max-time 900 -o stage/$f "$BASE/$f" || echo "FAILED $f"
          done
          ls -la stage
      - name: Repack
        continue-on-error: true
        run: |
          exec > >(tee -a stage-out/log.txt) 2>&1
          pip install --quiet numpy safetensors
          python3 - <<'PY'
          import json, os, struct, numpy as np
          os.makedirs("stage/chunks", exist_ok=True)
          with open("stage/model.safetensors","rb") as f:
              n = struct.unpack("<Q", f.read(8))[0]
              hdr = json.loads(f.read(n))
          from safetensors import safe_open
          names = sorted(k for k in hdr if k != "__metadata__")
          CHUNK = 45*1024*1024
          tensors, curbuf, cidx = [], bytearray(), 0
          def flush(buf, idx):
              if not buf: return
              open(f"stage/chunks/w_{idx:03d}.bin","wb").write(bytes(buf))
          with safe_open("stage/model.safetensors", framework="numpy") as f:
              for name in names:
                  a = f.get_tensor(name)
                  raw = a.tobytes()
                  if len(curbuf) + len(raw) > CHUNK:
                      flush(curbuf, cidx); curbuf = bytearray(); cidx += 1
                  off = len(curbuf); curbuf += raw
                  tensors.append({"name": name, "dtype": str(a.dtype), "shape": list(a.shape),
                                  "chunk": cidx, "offset": off, "nbytes": len(raw)})
          flush(curbuf, cidx)
          cfg = json.load(open("stage/config.json"))
          json.dump({"arch":"smollm2","source":"HuggingFaceTB/SmolLM2-135M-Instruct",
                     "config":cfg,"tensors":tensors,"chunk_size":CHUNK},
                    open("stage/manifest.json","w"), indent=1)
          print("params:", sum(int(np.prod(t["shape"])) for t in tensors))
          print(json.dumps(cfg))
          PY
          cp stage/manifest.json stage/config.json stage/tokenizer.json stage/tokenizer_config.json stage/generation_config.json stage-out/
          cp -r stage/chunks stage-out/
          du -sh stage-out/* | tail -8
      - name: Commit whatever we have
        if: always()
        run: |
          git config user.name "arena-agent"; git config user.email "agent@arena.ai"
          git checkout --orphan weights-tmp2
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -A stage-out
          git commit -q -m "staged weights run" || true
          git push -f origin weights-tmp2 || echo "PUSH FAILED"
