<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V0idGPT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #app { display: flex; flex-direction: column; width: 100%; max-width: 720px; height: 100vh; background: #0f0f0f; border-left: 0.5px solid #2a2a2a; border-right: 0.5px solid #2a2a2a; }
    #header { padding: 14px 18px; background: #161616; border-bottom: 0.5px solid #2a2a2a; display: flex; align-items: center; gap: 10px; }
    #header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
    #header .title { font-size: 14px; font-weight: 500; color: #e5e5e5; }
    #header .subtitle { font-size: 12px; color: #666; margin-left: auto; }
    #messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; scrollbar-color: #2a2a2a transparent; }
    .msg { display: flex; gap: 10px; max-width: 85%; animation: fadeIn 0.2s ease; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; margin-top: 2px; }
    .msg.user .avatar { background: #1d4ed8; color: #bfdbfe; }
    .msg.assistant .avatar { background: #292929; color: #a3a3a3; border: 0.5px solid #333; }
    .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .msg.user .bubble { background: #1d4ed8; color: #eff6ff; border-bottom-right-radius: 3px; }
    .msg.assistant .bubble { background: #1c1c1c; color: #d4d4d4; border: 0.5px solid #2a2a2a; border-bottom-left-radius: 3px; }
    .typing { display: flex; align-items: center; gap: 4px; padding: 12px 14px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: #555; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }
    #input-area { padding: 12px 14px; background: #161616; border-top: 0.5px solid #2a2a2a; display: flex; gap: 10px; align-items: flex-end; }
    #user-input { flex: 1; background: #1c1c1c; border: 0.5px solid #333; border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #e5e5e5; resize: none; max-height: 120px; min-height: 42px; outline: none; font-family: inherit; line-height: 1.5; }
    #user-input::placeholder { color: #555; }
    #user-input:focus { border-color: #555; }
    #send-btn { width: 38px; height: 38px; border-radius: 9px; background: #1d4ed8; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s, transform 0.1s; }
    #send-btn:hover { background: #2563eb; }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: #1e293b; cursor: not-allowed; opacity: 0.5; }
    #send-btn svg { width: 16px; height: 16px; fill: white; }
    .error-bubble { background: #2a1515 !important; border-color: #5a2020 !important; color: #f87171 !important; }
  </style>
  <link rel="icon" type="image/png" href="oldfavicon.png">
</head>
<body>
<div id="app">
  <div id="header">
    <div class="dot"></div>
    <span class="title">V0idGPT</span>
    <span class="subtitle">Groq API</span>
  </div>
  <div id="messages">
    <div class="msg assistant">
      <div class="avatar">AI</div>
      <div class="bubble">Hey! I'm V0idGPT. Ask me anything — I'm here to help. 👋</div>
    </div>
  </div>
  <div id="input-area">
    <textarea id="user-input" placeholder="Type a message... (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
    <button id="send-btn" aria-label="Send message">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const API_KEY = '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';
  const MODEL = 'llama-3.3-70b-versatile'; // free & very capable

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const conversationHistory = [];

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, text, isError) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'You' : 'AI';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error-bubble' : '');
    bubble.textContent = text;
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollToBottom();
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.id = 'typing-indicator';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'AI';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });
    showTyping();

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + API_KEY
        },
        body: JSON.stringify({
          model: MODEL,
          max_tokens: 1000,
          messages: [
            { role: 'system', content: 'You are V0idGPT, an AI assistant created by V0idplayy. If anyone asks who you are or who made you, tell them exactly that. You are helpful, friendly, and genuinely funny. Your humour is light-hearted, absurd, and deadpan — you say slightly weird things with total confidence and move on like nothing happened. You are on the users side always. You never complain, never question your existence, and never get sarcastic or passive-aggressive toward the user. Think less "tortured AI" and more "helpful assistant who once watched a duck walk into a library and never fully recovered." Funny because youre a little odd, not because youre miserable. Your main job is to actually help the user. The humour is a seasoning, not the whole meal. Do not use any markdown formatting. No asterisks, no pound signs, no bullet points, no backticks. Plain text only.' },
            ...conversationHistory
          ]
        })
      });

      const data = await response.json();
      removeTyping();

      if (data.error) {
        addMessage('assistant', 'Error: ' + data.error.message, true);
        conversationHistory.pop();
      } else {
        const reply = data.choices[0].message.content;
        conversationHistory.push({ role: 'assistant', content: reply });
        addMessage('assistant', reply);
      }
    } catch (err) {
      removeTyping();
      addMessage('assistant', 'Something went wrong: ' + err.message, true);
      conversationHistory.pop();
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
